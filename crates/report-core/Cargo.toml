[package]
name = "report-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
rusqlite = { version = "0.40.2", features = ["bundled"] }

cosmic-text = "0.14"
fontdb = "0.16.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
iced = "0.14.0"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
